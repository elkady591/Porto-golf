<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Porto Golf</title>
<meta name="theme-color" content="#0a7a93">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>
// Apply saved language/theme before first paint so the page doesn't flash.
try{
  const p=JSON.parse(localStorage.getItem("chalet-meters-prefs")||"{}"), r=document.documentElement;
  if(p.lang==="en"){ r.lang="en"; r.dir="ltr"; }
  if(p.mode==="light"||p.mode==="dark") r.dataset.theme=p.mode;
  if(p.palette && p.palette!=="sea") r.dataset.palette=p.palette;
}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column dashboard — alerts, a card per meter (electricity / water), then the entry form and history.
   Settings (language, theme, meters, GitHub sync, backup) live in a dialog behind the gear button. */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --fg:#17232b; --muted:#4e5d66; --line:#dde3e6; --accent:#0a7a93; --on-accent:#ffffff;
  --elec:#c27a00; --elec-soft:#fbf0db; --water:#0a7a93; --water-soft:#dcf1f5;
  --ok:#2c7a4b; --ok-soft:#e1f2e7; --warn:#a85d00; --warn-soft:#fdecd2; --bad:#b3261e; --bad-soft:#fbe2df;
  --display:"Cairo",Tahoma,"Segoe UI",sans-serif;
  --body:"Cairo",Tahoma,"Segoe UI",sans-serif;
}
/* Colour themes, light values. Placed before the dark blocks so dark mode still wins for the shared tokens. */
:root[data-palette="golf"]{--bg:#f2f5ef; --surface:#ffffff; --fg:#1b2a1e; --muted:#5d6d5f; --line:#dbe3d6; --accent:#2f7d3b; --on-accent:#ffffff}
:root[data-palette="sand"]{--bg:#f6f2ec; --surface:#fffdf9; --fg:#2a2219; --muted:#6f6457; --line:#e6ddd0; --accent:#a0622d; --on-accent:#ffffff}
:root[data-palette="graphite"]{--bg:#f2f2f3; --surface:#ffffff; --fg:#18181b; --muted:#63636b; --line:#dedee2; --accent:#3f3f46; --on-accent:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171c; --surface:#172229; --fg:#e6edf0; --muted:#93a4ad; --line:#26353d; --accent:#3fc0dc; --on-accent:#06242c;
  --elec:#f0a830; --elec-soft:#33280f; --water:#3fc0dc; --water-soft:#0f2f37;
  --ok:#5cc489; --ok-soft:#133022; --warn:#f0a447; --warn-soft:#3a2810; --bad:#ff7b72; --bad-soft:#3c1715; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171c; --surface:#172229; --fg:#e6edf0; --muted:#93a4ad; --line:#26353d; --accent:#3fc0dc; --on-accent:#06242c;
  --elec:#f0a830; --elec-soft:#33280f; --water:#3fc0dc; --water-soft:#0f2f37;
  --ok:#5cc489; --ok-soft:#133022; --warn:#f0a447; --warn-soft:#3a2810; --bad:#ff7b72; --bad-soft:#3c1715; color-scheme:dark}
@media (prefers-color-scheme: dark){
  :root[data-palette="golf"]:not([data-theme="light"]){--bg:#0f1610; --surface:#172119; --fg:#e5eee4; --muted:#93a596; --line:#26352a; --accent:#6cc77a; --on-accent:#0b2410}
  :root[data-palette="sand"]:not([data-theme="light"]){--bg:#17130e; --surface:#211b15; --fg:#efe7dc; --muted:#a89a88; --line:#352c22; --accent:#e0a066; --on-accent:#2a1806}
  :root[data-palette="graphite"]:not([data-theme="light"]){--bg:#111113; --surface:#1b1b1f; --fg:#ececef; --muted:#9a9aa3; --line:#2c2c31; --accent:#d4d4d8; --on-accent:#18181b}
}
:root[data-palette="golf"][data-theme="dark"]{--bg:#0f1610; --surface:#172119; --fg:#e5eee4; --muted:#93a596; --line:#26352a; --accent:#6cc77a; --on-accent:#0b2410}
:root[data-palette="sand"][data-theme="dark"]{--bg:#17130e; --surface:#211b15; --fg:#efe7dc; --muted:#a89a88; --line:#352c22; --accent:#e0a066; --on-accent:#2a1806}
:root[data-palette="graphite"][data-theme="dark"]{--bg:#111113; --surface:#1b1b1f; --fg:#ececef; --muted:#9a9aa3; --line:#2c2c31; --accent:#d4d4d8; --on-accent:#18181b}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.65;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
h1{font-family:var(--display);font-weight:700;font-size:30px;margin:0;line-height:1.25}
h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0;text-wrap:balance}
h3{font-size:17px;margin:0;font-weight:700}
.sub{color:var(--muted);margin:0;font-size:15px}
.num{font-variant-numeric:tabular-nums}
.gear{width:42px;height:42px;padding:0;display:grid;place-items:center;border-radius:12px;background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.gear svg{width:22px;height:22px}
.alerts{display:grid;gap:8px}
.alert{border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-weight:500}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.remind{background:var(--water-soft);color:var(--water)}
.alert .dot{width:10px;height:10px;border-radius:50%;background:currentColor;margin-top:8px;flex:none}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;min-width:0}
.meter-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.meter-title{display:flex;align-items:center;gap:10px}
.glyph{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.elec .glyph{background:var(--elec-soft);color:var(--elec)}
.water .glyph{background:var(--water-soft);color:var(--water)}
.pill{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.none{background:var(--bg);color:var(--muted)}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font-family:var(--display);font-size:40px;font-weight:700;line-height:1}
.elec .big b{color:var(--elec)} .water .big b{color:var(--water)}
.big span{color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:0}
.stats div{display:grid;gap:0}
.stats dt{color:var(--muted);font-size:14px;font-weight:500}
.stats dd{margin:0;font-weight:700;font-size:17px}
.hint{color:var(--muted);font-size:14px;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;min-width:0}
form.entry{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:start}
form.entry label>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
form.entry>button[type=submit],form.entry>#fCancel{grid-column:1/-1}
label{display:grid;gap:4px;font-size:14px;font-weight:500;color:var(--muted)}
input,select{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;background:var(--accent);color:var(--on-accent)}
button:disabled{opacity:.5;cursor:default}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
button.link{background:none;color:var(--bad);padding:2px 6px;font-weight:500;font-size:13px}
button.link.edit{color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border-radius:0;background:transparent;color:var(--muted);font-weight:500;padding:8px 6px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tablewrap{overflow-x:auto}
.history{display:grid;gap:16px}
table.log{width:100%;border-collapse:collapse;font-size:15px}
.log th,.log td{text-align:start;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.log th{color:var(--muted);font-weight:600;font-size:14px}
.tag{font-size:13px;padding:2px 8px;border-radius:99px;font-weight:600}
.tag.elec{background:var(--elec-soft);color:var(--elec)} .tag.water{background:var(--water-soft);color:var(--water)}
.tag.rech{background:var(--ok-soft);color:var(--ok)}
.banner{background:var(--water-soft);color:var(--water);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.save{font-size:13px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filelabel{display:inline-flex;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:9px 16px;color:var(--muted)}

/* Settings dialog */
dialog.sheet{border:0;padding:0;margin:auto;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);border-radius:16px;background:var(--surface);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog.sheet::backdrop{background:rgba(10,16,20,.45)}
.sheet-head{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 18px;border-bottom:1px solid var(--line);z-index:1}
.sheet-body{padding:16px 18px 22px;display:grid;gap:22px}
.sheet section{display:grid;gap:10px}
.close{width:36px;height:36px;padding:0;display:grid;place-items:center;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:10px;font-size:18px;line-height:1}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.swatch{display:grid;gap:6px;justify-items:center;padding:10px 6px;background:var(--bg);color:var(--fg);border:2px solid transparent;border-radius:12px;font-weight:500;font-size:13px}
.swatch[aria-pressed="true"]{border-color:var(--accent)}
.swatch i{display:block;width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.1)}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;display:grid;gap:10px;min-width:0}
legend{padding:0 6px;font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (prefers-reduced-motion:no-preference){.card,.alert,body{transition:background .2s}}
/* Resort look: a soft hero header, shadowed cards with no borders, large numbers, stats as small tiles. */
:root{--hero-bg:linear-gradient(155deg,var(--accent),color-mix(in srgb,var(--accent) 62%,#001018));--hero-fg:#fff;--shadow:0 1px 2px rgba(16,40,48,.05),0 10px 30px rgba(16,40,48,.08);--bg:#eef3f4}
:root[data-palette="golf"]{--bg:#eef3ea} :root[data-palette="sand"]{--bg:#f4eee5} :root[data-palette="graphite"]{--bg:#efeff1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hero-bg:linear-gradient(155deg,color-mix(in srgb,var(--accent) 30%,var(--surface)),var(--surface));--hero-fg:var(--fg);--shadow:0 0 0 1px var(--line)}}
:root[data-theme="dark"]{--hero-bg:linear-gradient(155deg,color-mix(in srgb,var(--accent) 30%,var(--surface)),var(--surface));--hero-fg:var(--fg);--shadow:0 0 0 1px var(--line)}

.wrap{gap:18px;padding-top:16px}
header{background:var(--hero-bg);color:var(--hero-fg);border-radius:28px;padding:22px 22px 26px;align-items:center}
header h1{font-size:28px}
header .sub{color:inherit;opacity:.85;font-size:14px;max-width:32ch}
header .save{color:inherit;opacity:.8}
.gear{background:rgba(255,255,255,.16);color:inherit;border:0;border-radius:50%;width:46px;height:46px}
.alert{border-radius:18px;padding:14px 16px}
.card,.panel{border:0;border-radius:24px;padding:20px;box-shadow:var(--shadow);gap:16px}
.glyph{width:46px;height:46px;border-radius:50%}
.meter-title h2{font-size:21px}
.pill{padding:5px 12px;font-size:13px}
.big b{font-size:54px;letter-spacing:-.02em}
.big span{font-size:15px}
.big{margin-bottom:-4px}
.meter-bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden}
.meter-bar i{display:block;height:100%;border-radius:inherit;background:var(--ok)}
.meter-bar.warn i{background:var(--warn)} .meter-bar.bad i{background:var(--bad)}
.lasts{margin:-6px 0 0;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.lasts b{font-size:17px} .lasts span{color:var(--muted);font-size:14px}
.due{display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:16px;padding:12px 16px;background:var(--ok-soft);color:var(--ok)}
.due.warn{background:var(--warn-soft);color:var(--warn)} .due.none{margin:0;background:var(--bg);color:var(--muted);font-size:15px;line-height:1.6} .due.bad{background:var(--bad-soft);color:var(--bad)}
.due span{font-weight:500;font-size:15px} .due b{font-size:17px}
.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--bg);border-radius:14px;padding:10px 12px;align-content:space-between;gap:4px}
.stats dt{font-size:13px;line-height:1.35}
.stats dd{font-size:16px;white-space:nowrap}
input,select{border:0;border-radius:14px;padding:12px 14px;background:var(--bg)}
.seg{border:0;background:var(--bg);border-radius:99px;padding:4px;gap:4px}
.seg button{border-radius:99px;padding:8px 10px}
form.entry>button[type=submit],button{border-radius:14px}
form.entry>button[type=submit]{padding:14px;font-size:17px}
button.ghost,.filelabel{border-radius:14px}
.log th,.log td{padding:12px 6px}
.log tr:last-child td{border-bottom:0}
.banner{border-radius:18px;padding:12px 16px}
dialog.sheet{border-radius:26px}
.swatch{border-radius:16px}
fieldset{border-radius:16px}

/* Ring layout */
.meters.lay-ring,.meters.lay-summary{grid-template-columns:1fr}
.ring{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;position:relative}
.ring svg{width:150px;height:150px;grid-row:1;grid-column:1}
.ring-mid{grid-row:1;grid-column:1;display:grid;justify-items:center;align-content:center;text-align:center}
.ring-mid b{font-family:var(--display);font-size:38px;font-weight:700;line-height:1.1}
.ring-mid span{color:var(--muted);font-size:13px}
.ring-side{margin:0;display:grid;gap:8px}
.ring-side div{display:grid}
.ring-side dt{color:var(--muted);font-size:13px}
.ring-side dd{margin:0;font-weight:700;font-size:17px}
.ring-side dd.big-val{font-family:var(--display);font-size:26px;line-height:1.2}
.elec .big-val{color:var(--elec)} .water .big-val{color:var(--water)}
.spend{gap:14px}
.spend-top{display:grid;justify-items:start}
.spend-top>span{color:var(--muted);font-size:14px;font-weight:500}
.spend-top>b{font-family:var(--display);font-size:38px;font-weight:700;line-height:1.15}
.spend-top>small{color:var(--muted);font-size:13px}
.stack{display:flex;gap:4px;height:12px}
.stack i{display:block;border-radius:99px;min-width:6px}
.stack i.elec,.split .elec .dot{background:var(--elec)} .stack i.water,.split .water .dot{background:var(--water)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split>div{display:grid;gap:2px;background:var(--bg);border-radius:14px;padding:10px 12px}
.split span{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.split .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.split b{font-size:18px}
.split small{color:var(--muted);font-size:13px}
.month-rech{margin:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;background:var(--ok-soft);color:var(--ok);border-radius:14px;padding:10px 14px}
.month-rech span{font-weight:500;font-size:14px} .month-rech b{font-size:17px} .month-rech small{font-size:13px;opacity:.85}
.month-rech.none{background:var(--bg);color:var(--muted);font-size:14px}

/* Header: title + gear on one row, next-recharge box full width below */
header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 12px;align-items:start}
.head-title{grid-column:1;grid-row:1;display:grid;gap:2px;min-width:0}
.head-side{grid-column:2;grid-row:1;display:block}
.head-title .save{display:inline-flex;align-items:center;gap:6px;font-size:13px;margin-top:4px}
.head-title .save:not(:empty)::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.9}
header:has(#headNext:not([hidden])) .sub{display:none}
.head-next{grid-column:1/-1;display:grid;gap:2px;background:rgba(255,255,255,.14);border-radius:18px;padding:14px 16px}
.head-next>span{opacity:.85;font-size:14px}
.head-next>b{font-size:21px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.glyph-s{display:inline-grid}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{gap:6px;padding:16px;align-content:start}
.mini .glyph{width:38px;height:38px}
.mini-name{color:var(--muted)}
.mini>b{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1}
.mini>b small{font-size:15px;font-weight:600;color:var(--muted)}
.mini-due{font-size:13px;font-weight:600;color:var(--ok)}
.mini-due.warn{color:var(--warn)} .mini-due.bad{color:var(--bad)}
.mini.tappable{cursor:pointer}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.quick button{padding:7px 4px;font-size:13px;border-radius:12px;white-space:nowrap}
#detailBody .card{box-shadow:none;padding:0}
#detailBody .meter-head{display:none}
.mini.elec>b{color:var(--elec)} .mini.water>b{color:var(--water)}
.mini-sub{color:var(--muted);font-size:13px}
.mini .meter-bar{height:7px;margin-top:auto}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-title">
      <h1>Porto Golf</h1>
      <p class="sub" data-i18n="sub"></p>
      <span class="save" id="saveState"></span>
    </div>
    <div class="head-next" id="headNext" hidden></div>
    <div class="head-side">
      <button type="button" class="gear" id="gearBtn" data-i18n-aria="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <div id="demoBanner" class="banner" hidden>
    <span data-i18n="demo"></span>
    <button class="ghost" id="clearDemo" type="button" data-i18n="startMine"></button>
  </div>

  <section class="alerts" id="alerts" aria-live="polite"></section>

  <section class="meters" id="meters"></section>

  <section class="panel">
    <h2 data-i18n="addTitle"></h2>

};

/* Synced entries carry `u` = last-changed time and `del` for deletions,

  settingsU:0,
  entries:[]
});

let sel = {meter:"elec", kind:"reading"};

const fmtDateS = ts => new Date(ts).toLocaleDateString(locale(),{weekday:"short",day:"numeric",month:"short"});
const fmtD = ts => new Date(ts).toLocaleDateString(locale(),{day:"numeric",month:"short",year:"numeric"});
const fmtDT = ts => new Date(ts).toLocaleString(locale(),{day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"});

function localInput(ts){const d=new Date(ts);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
// The form asks for a date only; the entry keeps the current time of day so same-day entries stay in order.
function dateToTs(v){const [y,m,d]=v.split("-").map(Number), n=new Date();return new Date(y,m-1,d,n.getHours(),n.getMinutes(),n.getSeconds()).getTime();}

/* ---------- core calculation ---------- */
function analyze(key){
  const cfg = state.meters[key];
  const es = live(state.entries).filter(e=>e.m===key).sort((a,b)=>a.t-b.t);
  const reads = es.filter(e=>e.k==="reading");
  const rechs = es.filter(e=>e.k==="recharge");
  const now = Date.now();
  const out = {key,cfg,reads,rechs,intervals:[]};

  for(let i=1;i<reads.length;i++){
    const a=reads[i-1], b=reads[i];
    const added = rechs.filter(r=>r.t>a.t && r.t<=b.t).reduce((s,r)=>s+r.v,0);
    const used = Math.max(0, a.v + added - b.v);
    out.intervals.push({from:a.t,to:b.t,used,days:(b.t-a.t)/DAY,readId:b.id});
  }

  // Rate from the last 45 days; if those cover less than a day, use all readings.
  let win = out.intervals.filter(iv=>iv.to>=now-45*DAY);
  if(win.reduce((s,iv)=>s+iv.days,0) < 1) win = out.intervals;
  const days = win.reduce((s,iv)=>s+iv.days,0);
  out.rate = days>0.04 ? win.reduce((s,iv)=>s+iv.used,0)/days : null; // EGP per day

  if(reads.length){
    const last = reads[reads.length-1];
    const after = rechs.filter(r=>r.t>last.t).reduce((s,r)=>s+r.v,0);
    out.lastReading = last;
    out.balance = Math.max(0, last.v + after - (out.rate||0)*Math.max(0,(now-last.t)/DAY));
  }
  if(out.rate!=null && out.balance!=null){
    out.perDay = out.rate;
    out.perMonth = out.perDay*30;
    if(out.rate>0){
      out.daysLeft = out.balance/out.rate;
      out.emptyAt = now + out.daysLeft*DAY;
      out.rechargeBy = out.emptyAt - cfg.alertDays*DAY;
    } else out.daysLeft = Infinity;
  }
  const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
  out.rechargedThisMonth = rechs.filter(r=>r.t>=monthStart.getTime()).reduce((s,r)=>s+r.v,0);
  // Reading reminder: every 3 days while the app is still learning (under 6 readings or 3 weeks), then weekly.
  if(reads.length){
    const learning = reads.length<6 || now-reads[0].t < 21*DAY;
    out.readEvery = learning ? 3 : 7;
    out.readDueAt = out.lastReading.t + out.readEvery*DAY;
    out.readDue = now >= out.readDueAt;
    out.sinceRead = Math.floor((now-out.lastReading.t)/DAY);
  }
  if(out.balance==null || out.rate==null) out.status="none";
  else if(out.balance<=0 || out.daysLeft<=1) out.status="bad";
  else if(out.daysLeft<=cfg.alertDays) out.status="warn";
  else out.status="ok";
  return out;
}

/* ---------- rendering ---------- */
function unitLabel(){return t("egp");}
function daysText(d){ return d===Infinity ? t("noUse") : d<1 ? t("lessDay") : t("nDays",{n:fmt(d,0)}); }

function meterCard(a){
  const m=METERS[a.key], u=unitLabel(a.cfg,a.key);
  let body;
  if(a.balance==null){
    body=`<p class="hint">${t("cardEmpty",{m:meterName(a.key)})}</p>`;
  } else if(a.status==="none"){
    body=`<div class="big"><b class="num">${fmt(a.balance)}</b><span>${t("lastReadingU",{u})}</span></div>
      <div class="meter-bar none" aria-hidden="true"><i style="width:0"></i></div>
      <p class="due none">${t("needSecond")}</p>`;
  } else {
    const left = a.daysLeft===Infinity ? t("noUse") : (a.daysLeft>730 ? t("overYears") : daysText(a.daysLeft));
    const frac = a.daysLeft===Infinity ? 1 : Math.max(0,Math.min(1,a.daysLeft/30));
    body=`<div class="big"><b class="num">${fmt(a.balance)}</b><span>${t("remaining",{u})}</span></div>
      <div class="meter-bar ${a.status}" aria-hidden="true"><i style="width:${(frac*100).toFixed(1)}%"></i></div>
      <p class="lasts"><b class="num">${left}</b><span>${a.emptyAt?t("emptyOn")+" "+fmtDateS(a.emptyAt):""}</span></p>
      <div class="due ${a.status}"><span>${t("rechargeBy")}</span><b>${a.rechargeBy==null?"—":(a.rechargeBy<=Date.now()?t("today"):fmtDateS(a.rechargeBy))}</b></div>
      <dl class="stats">
        <div><dt>${t("perDay")}</dt><dd class="num">${money(a.perDay)}</dd></div>
        <div><dt>${t("perMonth")}</dt><dd class="num">${money(a.perMonth)}</dd></div>
        <div><dt>${t("rechargedMonth")}</dt><dd class="num">${money(a.rechargedThisMonth)}</dd></div>
      </dl>
      <p class="hint">${t("rateHint",{r:fmt(a.rate,2),u,w:fmt(45,0),t:fmtD(a.lastReading.t)})}</p>`;
  }
  return `<article class="card ${a.key}">
    <div class="meter-head">
      <div class="meter-title"><span class="glyph">${m.icon}</span><h2>${meterName(a.key)}</h2></div>
      <span class="pill ${a.status}">${t("pill_"+a.status)}</span>
    </div>${body}</article>`;
}

function renderAlerts(list){
  const items=[];
  for(const a of list){
    const n=meterName(a.key);
    if(a.status==="bad") items.push(`<div class="alert bad"><span class="dot"></span><span>${t("alertBad",{m:n,d:daysText(a.daysLeft)})}</span></div>`);
    else if(a.status==="warn") items.push(`<div class="alert warn"><span class="dot"></span><span>${t("alertWarn",{m:n,n:fmt(a.daysLeft,0),date:fmtDate(a.emptyAt)})}</span></div>`);
  }
  for(const a of list) if(a.readDue)
    items.push(`<div class="alert remind"><span class="dot"></span><span>${t("remindRead",{m:meterName(a.key),d:daysText(a.sinceRead)})}${a.readEvery===3?" "+t("remindLearning"):""}</span></div>`);
  if(!items.length && list.every(a=>a.status==="ok") && prefs.layout!=="summary"){
    const rb=list.map(a=>a.rechargeBy).filter(Boolean);
    items.push(`<div class="alert ok"><span class="dot"></span><span>${t("alertOk")}${rb.length?t("alertNext",{date:fmtDate(Math.min(...rb))}):""}</span></div>`);
  }
  $("#alerts").innerHTML=items.join("");
}

// What was actually recharged on this meter since the 1st of the month.
function monthRecharges(list){
  const start=new Date(); start.setDate(1); start.setHours(0,0,0,0);
  const r=list.filter(e=>e.k==="recharge" && e.t>=start.getTime());
  if(!r.length) return `<p class="month-rech none">${t("noRechMonth")}</p>`;
  const n=r.length, sum=r.reduce((s,e)=>s+e.v,0);
  const times = prefs.lang==="en" ? (n===1?"once":n===2?"twice":`${n} times`)
    : (n===1?"مرة واحدة":n===2?"مرتين":n<=10?`${fmt(n,0)} مرات`:`${fmt(n,0)} مرة`);
  return `<p class="month-rech"><span>${t("rechargedMonthLog")}</span><b class="num">${fmt(sum,0)} ${t("cur")}</b><small>${times}</small></p>`;
}

// Arabic uses the plural only for 3–10; English only for anything but 1.
const daysLeftWord = n => (prefs.lang==="en" ? n!==1 : n>=3 && n<=10) ? t("daysLeftMany") : t("daysLeftOne");

function ringCard(a){

// Monthly figures are rounded per meter first, so the total is exactly the sum of the rows shown.
function monthTotals(list){
  const known=list.filter(a=>a.perMonth!=null);
  const rows=known.map(a=>({key:a.key, month:Math.round(a.perMonth), day:a.perDay}));
  return {rows, month:rows.reduce((s,r)=>s+r.month,0), day:known.reduce((s,a)=>s+a.perDay,0),
    rech:list.reduce((s,a)=>s+a.rechargedThisMonth,0)};
}
const egp0 = n => `${fmt(n,0)} ${t("cur")}`;

// Expected monthly spend: one total, a bar split by meter, then each meter's share.
function totalsCard(list){
  const m=monthTotals(list);
  if(!m.rows.length) return "";
  const pct=r => m.month>0 ? Math.round(r.month/m.month*100) : 0;
  return `<article class="card spend">
    <div class="spend-top">
      <span>${t("monthTotal")}</span>
      <b class="num">${egp0(m.month)}</b>
      <small class="num">${t("aboutPerDay",{v:fmt(m.day,1)})}</small>
    </div>
    <div class="stack" aria-hidden="true">${m.rows.map(r=>`<i class="${r.key}" style="flex-grow:${Math.max(r.month,0.0001)}"></i>`).join("")}</div>
    <div class="split">${m.rows.map(r=>`<div class="${r.key}">
      <span><i class="dot"></i>${meterName(r.key)}</span>
      <b class="num">${egp0(r.month)}</b>
      <small class="num">${t("avgPerDay",{v:fmt(r.day,1)})}</small>
      <small class="num">${fmt(pct(r),0)}${prefs.lang==="en"?"%":"٪"}</small>
    </div>`).join("")}</div>
  </article>`;
}


function headNext(list){
  const due=list.filter(a=>a.rechargeBy!=null).sort((x,y)=>x.rechargeBy-y.rechargeBy)[0];

/* ---------- local storage ---------- */
function persist(){

// The service worker can't read localStorage, so hand it the predicted dates (and the texts in the chosen language) through the Cache API.
function shareWithWorker(){
  if(!("caches" in window) || demo) return;
  const list=["elec","water"].map(analyze);
  const due=list.filter(a=>a.rechargeBy).map(a=>({key:a.key,label:meterName(a.key),rechargeBy:a.rechargeBy,emptyAt:a.emptyAt}));
  const remind=list.filter(a=>a.readDueAt).map(a=>({key:a.key,label:meterName(a.key),dueAt:a.readDueAt,lastRead:a.lastReading.t}));
  const payload={due,remind,saved:Date.now(),lang:prefs.lang,dir:prefs.lang==="en"?"ltr":"rtl",
    text:{remind:L().remindRead, days:L().nDays, bad:L().notifBad, soon:prefs.lang==="en"?"About {n} days left on {m}. Recharge soon.":"فاضل حوالي {n} يوم في رصيد {m}. اشحن قريب."}};
  caches.open("chalet-state").then(c=>c.put("state.json",new Response(JSON.stringify(payload),{headers:{"Content-Type":"application/json"}}))).catch(()=>{});
}
function normalize(d){
  const b=blank();
  if(!d||typeof d!=="object") return b;
  for(const k of ["elec","water"]) Object.assign(b.meters[k], (d.meters||{})[k]||{});
  b.settingsU=+d.settingsU||0;
  b.entries=Array.isArray(d.entries)?d.entries.filter(e=>e&&e.id&&METERS[e.m]&&typeof e.t==="number"&&typeof e.v==="number").map(e=>({...e,u:+e.u||e.t})):[];
  return b;
}

/* ---------- GitHub sync: the whole dataset as one JSON file in the user's own private repo (same as Petrol) ---------- */
const GH_KEY=KEY+"-gh", GH_TOK=KEY+"-ghtoken", GH_FILE="porto-golf-data.json";
let gh=null, syncTimer=null, syncing=false, syncErr="";
try{ gh=JSON.parse(localStorage.getItem(GH_KEY)||"null"); }catch(e){}
const ghTok=()=>{ try{ return localStorage.getItem(GH_TOK)||""; }catch(e){ return ""; } };
const syncOn=()=>!!(gh&&gh.repo&&ghTok());
function ghSave(){ try{ gh ? localStorage.setItem(GH_KEY,JSON.stringify(gh)) : localStorage.removeItem(GH_KEY); }catch(e){} }
function b64e(s){const b=new TextEncoder().encode(s);let o="";for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o);}
function b64d(c){const s=atob(c.replace(/\s/g,""));return new TextDecoder().decode(Uint8Array.from(s,ch=>ch.charCodeAt(0)));}
const ghApi=(path,opt={})=>fetch("https://api.github.com/repos/"+gh.repo+path,{cache:"no-store",...opt,headers:{Authorization:"Bearer "+ghTok(),Accept:"application/vnd.github+json"}});
const syncDoc=()=>({app:"porto-golf",v:1,updated:new Date().toISOString(),entries:state.entries,settings:{u:state.settingsU,meters:state.meters}});
// Two phones can both have changes: keep every record, the newest edit of each one wins (deletions are kept as del=1).
function mergeById(a,b){
  const map=new Map();
  for(const r of [...a,...b]){ const cur=map.get(r.id); if(!cur || (+r.u||0)>(+cur.u||0)) map.set(r.id,r); }
  return [...map.values()];
}
function mergeIn(doc){
  state.entries=mergeById(state.entries, normalize({entries:doc.entries}).entries);
  const s=doc.settings;
  if(s && +s.u>state.settingsU){ state.meters=normalize({meters:s.meters}).meters; state.settingsU=+s.u; renderSettings(); }
}
function scheduleSync(ms=2500){ if(!syncOn()) return; clearTimeout(syncTimer); syncTimer=setTimeout(syncNow,ms); }
async function syncNow(){
  if(!syncOn() || demo || syncing) return;
  if(!navigator.onLine){ syncErr=t("syncOffline"); renderSync(); return; }
  syncing=true; renderSync(); let retry=60000;
  try{
    const r=await ghApi("/contents/"+GH_FILE); let sha=null, changed=false;
    if(r.status===200){ const j=await r.json(); sha=j.sha;
      if(sha!==gh.sha){ mergeIn(JSON.parse(b64d(j.content))); gh.sha=sha; changed=true; } }
    else if(r.status!==404) throw r.status;
    if(gh.dirty || changed || !sha){
      const p=await ghApi("/contents/"+GH_FILE,{method:"PUT",body:JSON.stringify({message:"Porto Golf sync",content:b64e(JSON.stringify(syncDoc())),...(sha?{sha}:{})})});
      if(!p.ok) throw p.status;
      gh.sha=(await p.json()).content.sha; gh.dirty=false; retry=2500;
    }
    gh.last=Date.now(); syncErr="";
    try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){}
    setSave("savedSynced");
    if(changed){ shareWithWorker(); notifyIfDue(render()); }
  }catch(e){
    // 409/422: another phone just pushed, so pull again shortly
    if(e===409||e===422){ retry=1500; syncErr=""; }
    else syncErr = e===401||e===403 ? t("syncBadTok") : e===404 ? t("syncNoRepo") : t("syncNet");
    if(gh) gh.dirty=true;
  }finally{
    syncing=false; ghSave(); renderSync();
    if(gh && gh.dirty) scheduleSync(retry);
  }
}
function renderSync(){
  const on=syncOn();
  $("#syncOff").hidden=on; $("#syncOn").hidden=!on;
  const r=on?gh.repo:"";
  $("#syncState").textContent = !on ? t("syncOffNote")
    : syncing ? t("syncing",{r})
    : syncErr ? t("syncFail",{r,e:syncErr})
    : gh.last ? t("syncLast",{r,t:fmtDT(gh.last)}) : t("syncNever",{r});
}

/* ---------- notifications ---------- */
async function swReg(){ try{ return "serviceWorker" in navigator ? await navigator.serviceWorker.ready : null; }catch(e){ return null; } }
function notifRefresh(){
  const s=$("#notifState"), b=$("#notifBtn");
  if(!("Notification" in window)){ s.textContent=t("notifUnsupported"); b.hidden=true; return; }
  if(Notification.permission==="granted"){ s.textContent=t("notifOn"); b.hidden=true; }
  else if(Notification.permission==="denied"){ s.textContent=t("notifDenied"); b.hidden=true; }
  else { s.textContent=t("notifAsk"); b.hidden=false; }
}
async function registerPeriodic(){
  const reg=await swReg();
  if(!reg || !("periodicSync" in reg)) return;
  try{
    const st=await navigator.permissions.query({name:"periodic-background-sync"});
    if(st.state==="granted") await reg.periodicSync.register("chalet-check",{minInterval:12*60*60*1000});
  }catch(e){}
}
async function notifyIfDue(list){
  if(demo || !("Notification" in window) || Notification.permission!=="granted") return;
  const today=new Date().toDateString();
  let last={}; try{ last=JSON.parse(localStorage.getItem(KEY+"-notified")||"{}"); }catch(e){}
  const reg=await swReg();
  for(const a of list){
    if(a.status!=="warn" && a.status!=="bad") continue;
    if(last[a.key]===today) continue;
    const n=meterName(a.key);
    const body = a.status==="bad" ? t("notifBad",{m:n}) : t("notifWarn",{m:n,n:fmt(a.daysLeft,0),date:fmtDate(a.emptyAt)});
    const opts={body,icon:"icon-192.png",badge:"icon-192.png",tag:"chalet-"+a.key,lang:prefs.lang,dir:prefs.lang==="en"?"ltr":"rtl"};
    try{
      if(reg) await reg.showNotification("Porto Golf",opts);
      else new Notification("Porto Golf",opts);
      last[a.key]=today;
    }catch(e){}
  }
  for(const a of list){
    if(!a.readDue || last["read-"+a.key]===today) continue;
    const opts={body:t("remindRead",{m:meterName(a.key),d:daysText(a.sinceRead)}),icon:"icon-192.png",badge:"icon-192.png",
      tag:"chalet-read-"+a.key,lang:prefs.lang,dir:prefs.lang==="en"?"ltr":"rtl"};
    try{
      if(reg) await reg.showNotification("Porto Golf",opts);
      else new Notification("Porto Golf",opts);
      last["read-"+a.key]=today;
    }catch(e){}
  }
  try{ localStorage.setItem(KEY+"-notified",JSON.stringify(last)); }catch(e){}
}

/* ---------- start ---------- */
function init(){
  applyPrefs();
  resetWhen();
  try{ const raw=localStorage.getItem(KEY); if(raw) state=normalize(JSON.parse(raw)); }catch(e){}
  if(!live(state.entries).length && !syncOn()) loadDemo();
  setSave(demo ? "" : "saved");
  renderSettings();
  const list=render();
  renderSync();
  notifRefresh();
  shareWithWorker();
  notifyIfDue(list);
  if(syncOn()) syncNow();
}

/* ---------- events ---------- */
function bindSeg(id,fn){
  $(id).addEventListener("click",e=>{
    const b=e.target.closest("[data-v]"); if(!b) return;
    fn(b.dataset.v, b);
  });
}
const pressOnly=(id,b)=>$(id).querySelectorAll("[data-v]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
bindSeg("#segMeter",(v,b)=>{ sel.meter=v; pressOnly("#segMeter",b); render(); });
bindSeg("#segKind",(v,b)=>{ sel.kind=v; pressOnly("#segKind",b); render(); });
bindSeg("#segLang",v=>{ setPref("lang",v); renderSync(); });
bindSeg("#segMode",v=>setPref("mode",v));
bindSeg("#segLayout",v=>setPref("layout",v));
bindSeg("#swatches",v=>setPref("palette",v));

const dlg=$("#settingsDlg");
$("#gearBtn").addEventListener("click",()=>{ if(dlg.showModal) dlg.showModal(); else dlg.setAttribute("open",""); });
$("#closeSettings").addEventListener("click",()=>dlg.close ? dlg.close() : dlg.removeAttribute("open"));

const detailDlg=$("#detailDlg");
$("#closeDetail").addEventListener("click",()=>detailDlg.close ? detailDlg.close() : detailDlg.removeAttribute("open"));
function openDetail(k){
  $("#detailTitle").textContent=meterName(k);
  $("#detailBody").innerHTML=meterCard(analyze(k));
  if(detailDlg.showModal) detailDlg.showModal(); else detailDlg.setAttribute("open","");
}
function quickEntry(m,kind){
  sel.meter=m; sel.kind=kind;
  $("#segMeter").querySelectorAll("[data-v]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.v===m)));
  $("#segKind").querySelectorAll("[data-v]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.v===kind)));
  render();
  $("#entryForm").scrollIntoView({behavior:"smooth",block:"center"});
  setTimeout(()=>$("#fVal").focus({preventScroll:true}),350);
}
$("#meters").addEventListener("click",e=>{
  const q=e.target.closest("[data-quick]");
  if(q){ quickEntry(q.dataset.m,q.dataset.quick); return; }
  const d=e.target.closest("[data-detail]"); if(d) openDetail(d.dataset.detail);
});
$("#meters").addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ") && e.target.matches("[data-detail]")){ e.preventDefault(); openDetail(e.target.dataset.detail); }
});
dlg.addEventListener("click",e=>{ if(e.target===dlg) dlg.close(); }); // tap outside the sheet closes it

$("#clearDemo").addEventListener("click",()=>{ leaveDemo(); render(); persist(); });

$("#entryForm").addEventListener("submit",e=>{
  e.preventDefault();
  const v=parseFloat($("#fVal").value), ts=$("#fWhen").value?dateToTs($("#fWhen").value):0;
  if(!(v>=0)||!ts) return;
  const rec=editing && state.entries.find(x=>x.id===editing);
  if(rec){
    // Keep the original time of day when the date wasn't changed.
    Object.assign(rec,{m:sel.meter,k:sel.kind,v,u:Date.now()});
    if($("#fWhen").value!==localInput(rec.t)) rec.t=ts;
    endEdit();
    render(); if(!demo) persist();
    return;
  }
  if(demo) leaveDemo();
  state.entries.push({id:uid(),m:sel.meter,k:sel.kind,t:ts,v,u:Date.now()});
  $("#fVal").value=""; resetWhen();
  render(); persist();
});

/* ---------- editing an entry: the form is reused, with "Save changes" and "Cancel" ---------- */
let editing=null;
function setSubmitText(k){ const b=$("#fSubmit"); b.dataset.i18n=k; b.textContent=t(k); }
function startEdit(id){
  const rec=state.entries.find(x=>x.id===id); if(!rec) return;
  editing=id; sel.meter=rec.m; sel.kind=rec.k;
  pressOnly("#segMeter",$(`#segMeter [data-v="${rec.m}"]`));
  pressOnly("#segKind",$(`#segKind [data-v="${rec.k}"]`));
  $("#fWhen").value=localInput(rec.t); $("#fVal").value=rec.v;
  setSubmitText("saveEdit"); $("#fCancel").hidden=false;
  render();
  $("#entryForm").scrollIntoView({behavior:"smooth",block:"center"});
}
function endEdit(){
  editing=null; setSubmitText("submit"); $("#fCancel").hidden=true;
  $("#fVal").value=""; resetWhen();
}
$("#fCancel").addEventListener("click",()=>{ endEdit(); render(); });

$("#log").addEventListener("click",e=>{
  const ed=e.target.closest("[data-edit]"); if(ed){ startEdit(ed.dataset.edit); return; }
  const b=e.target.closest("[data-del]"); if(!b) return;
  if(b.dataset.confirm!=="1"){ b.dataset.confirm="1"; b.textContent=t("sure"); setTimeout(()=>{ if(b.isConnected){b.dataset.confirm="";b.textContent=t("del");} },3000); return; }
  if(demo){ state.entries=state.entries.filter(x=>x.id!==b.dataset.del); render(); return; }
  const rec=state.entries.find(x=>x.id===b.dataset.del);
  if(rec){ rec.del=1; rec.u=Date.now(); }
  if(editing===b.dataset.del) endEdit();
  render(); persist();
});

$("#settings").addEventListener("change",e=>{
  const f=e.target.dataset.f, k=e.target.closest("[data-k]").dataset.k; if(!f) return;
  const n=parseFloat(e.target.value); if(n>=0) state.meters[k][f]=n;
  state.settingsU=Date.now();
  renderSettings(); render(); persist();
});

$("#syncForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const err=$("#syncErr"), go=$("#syncGo");
  const fail=k=>{ err.textContent=t(k); err.hidden=false; go.disabled=false; };
  err.hidden=true;
  const repo=$("#syncRepo").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\.git$/,"").replace(/\/$/,"");
  const token=$("#syncTok").value.trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)) return fail("syncBadRepo");
  if(!token) return fail("syncNoTok");
  const old=gh, oldTok=ghTok();
  const undo=()=>{ gh=old; ghSave(); try{ oldTok ? localStorage.setItem(GH_TOK,oldTok) : localStorage.removeItem(GH_TOK); }catch(e){} };
  go.disabled=true;
  gh={repo,sha:null,dirty:true,last:null};
  try{ localStorage.setItem(GH_TOK,token); }catch(e){}
  try{
    const r=await ghApi(""); if(!r.ok) throw r.status;
    const j=await r.json();
    if(!j.private){ undo(); return fail("syncPublic"); }
    if(j.permissions && !j.permissions.push){ undo(); return fail("syncReadOnly"); }
  }catch(s){ undo(); return fail(s===401?"syncBadTok":s===404?"syncNoRepo":"syncNet"); }
  if(demo){ leaveDemo(); render(); }
  await syncNow();
  if(syncErr){ const m=syncErr; undo(); syncErr=""; renderSync(); err.textContent=m; err.hidden=false; go.disabled=false; return; }
  $("#syncTok").value=""; go.disabled=false; renderSync(); render();
});
$("#syncNow").addEventListener("click",syncNow);
$("#syncStop").addEventListener("click",()=>{
  const b=$("#syncStop");
  if(b.dataset.sure!=="1"){ b.dataset.sure="1"; b.textContent=t("syncStopSure"); setTimeout(()=>{ b.dataset.sure=""; b.textContent=t("syncStop"); },3000); return; }
  b.dataset.sure=""; b.textContent=t("syncStop");
  try{ localStorage.removeItem(GH_TOK); }catch(e){}
  gh=null; ghSave(); syncErr=""; renderSync();
  $("#syncState").textContent=t("syncStopped");
});
addEventListener("online",()=>syncNow());
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ if($("#fWhen").value===whenDefault) resetWhen(); render(); if(syncOn()) syncNow(); } });

$("#notifBtn").addEventListener("click",async()=>{
  try{ await Notification.requestPermission(); }catch(e){}
  notifRefresh();
  if(Notification.permission==="granted"){ await registerPeriodic(); notifyIfDue(["elec","water"].map(analyze)); }
});

$("#exportBtn").addEventListener("click",()=>{
  if(demo){ $("#backupState").textContent=t("backupNone"); return; }
  const blob=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="porto-golf-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  $("#backupState").textContent=t("backupDone");
});
$("#importFile").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  f.text().then(txt=>{
    const d=normalize(JSON.parse(txt));
    if(!d.entries.length) throw new Error("empty");
    state=d; demo=false; renderSettings(); render(); persist();
    $("#backupState").textContent=t("backupRestored",{n:fmt(d.entries.length,0)});
  }).catch(()=>{ $("#backupState").textContent=t("backupBad"); });
  e.target.value="";
});

// Auto mode follows the phone; refresh the browser bar colour when it flips.
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyPrefs); }catch(e){}

init();
setInterval(render, 10*60*1000); // keep "remaining balance" estimates current while the page stays open
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("./sw.js").then(()=>{ if("Notification" in window && Notification.permission==="granted") registerPeriodic(); }).catch(()=>{}); });
}
})();
</script>
